[package]
name = "sharp-dpapi-rs"
version = "1.20.0"
edition = "2021"
authors = ["Rust Port of SharpDPAPI"]
description = "Rust port of SharpDPAPI - A tool for DPAPI (Data Protection API) operations"
license = "BSD-3-Clause"

[[bin]]
name = "sharp-dpapi"
path = "src/main.rs"

[dependencies]
# Cryptography
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["sha1"] }
des = "0.8"
cbc = "0.1"
cipher = "0.4"

# Windows API bindings
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_WindowsProgramming",
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_Wmi",
] }

# Encoding/Decoding
base64 = "0.21"
hex = "0.4"

# XML parsing
quick-xml = "0.31"
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Utilities
chrono = "0.4"
regex = "1.10"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "wincrypt",
    "dpapi",
    "winbase",
    "winerror",
    "ntsecapi",
    "lmcons",
    "lmaccess",
    "sspi",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
